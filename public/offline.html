<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ESN Office – Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        padding: 2rem;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        padding: 2.5rem;
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(16px);
      }
      .card h1 {
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .card p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: rgba(248, 250, 252, 0.75);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.75rem;
        color: #0f172a;
        background: #38bdf8;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">ESN Office</div>
      <h1>You&apos;re currently offline</h1>
      <p>
        We couldn&apos;t reach the ESN Office servers. Please check your connection and try again once you&apos;re back online.
      </p>
    </main>
  </body>
</html>
